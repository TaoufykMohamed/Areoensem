    <title>Club AéroENSEM</title>

    <!-- Favicons — SPA à shell HTML unique (Vite, pas de layout séparé) :
         ce <head> est le seul de tout le site, il couvre toutes les routes.
         URLs absolues volontairement (pas relatives) pour que les
         crawlers/agrégateurs qui ne résolvent pas toujours le <base> les
         récupèrent correctement. -->
    <link rel="icon" href="https://aero-ensem.com/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/png" href="https://aero-ensem.com/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/png" href="https://aero-ensem.com/favicon-192x192.png" sizes="192x192" />
    <link rel="apple-touch-icon" href="https://aero-ensem.com/apple-touch-icon.png" sizes="180x180" />
    <link rel="manifest" href="https://aero-ensem.com/site.webmanifest" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Club AéroENSEM",
        "url": "https://aero-ensem.com"
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
